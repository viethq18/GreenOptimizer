name: Qwen3.8-27B-FP8
served_name: Qwen/Qwen3.8-27B-FP8
weight_bytes: 27.0e9          # FP8 weights read once per decode step
weight_gib_resident: 28.39    # server_native.log "weights" (incl. scales/embeds)
active_params: 27.0e9         # 2 FLOPs per param per token
max_context: 256000
attention:
