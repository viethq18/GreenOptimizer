  # conv state + replayssm intermediate window per slot (0.43 + 0.29 GiB / 155 slots)
  extra_bytes_per_slot: 4.9e6
  slots_per_request: 3
draft:                        # incoai/Qwen3.8-27B-DFlash2
  weight_gib: 3.69
  kv_bytes_per_token: 19.0e3  # bf16 K+V of the draft, per token
